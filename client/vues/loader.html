<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader</title>
    <style>
     .loader-container{
        display:flex;
        justify-content:center;
        align-items:center;
        position:relative;
        background-color: #fff;
      
     }
     .text-center-cn{
        position:absolute;
        text-align: center;
       top: 54%;
       left: 51%;
     }
     .c-loader{
        position:absolute;
        width:70px;
        height:70px;
        border-radius: 50%;
        border-top:3px solid blueviolet;
        background-color: aliceblue;
        top:50%;
        left:50%;
        animation:spin 1.8s linear infinite;
     }
     .charity{
        font-size: 30px;
        color: orange;
     }
     .net{
        font-size: 30px;
        color: blueviolet;
     }
     @keyframes spin{
        0%{
            transform:rotate(0deg);
        }
        100%{
            transform:rotate(360deg);
        }
     }
    </style>
</head>
<body>

    <div class="loader-conatiner">
        <div class="c-loader">
           
        </div>
        <span class="text-center-cn">
            <i class="charity">C</i><i class="net">N</i>
        </span>
    </div>
    
</body>
</html>
