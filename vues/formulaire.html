<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
    rel="stylesheet"
  />
    <title>Document</title>
    <style>
        body{
            font-family: Arial, sans-serif;
           
            flex-grow:1 ;
            overflow-x: hidden;
            width:100%;
        }
.form-ctn{
    display: flex;
    width:100%;
    margin:0;
    padding:0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background-color:#fff;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    border-radius: 4px;
    overflow-x: hidden;
}
.form-face{
    display: flex;
    align-items: center;
    justify-content: center;
    margin:20px;
    padding:25px;
    
}
.container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .toggle-container {
            display: flex;
            background-color: #e0e0e0;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 1rem;
        }

        .toggle-option {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 16px;
            transition: background-color 0.3s ease;
        }

        .toggle-option.active {
            background-color: #007bff;
            color: white;
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
          textarea {
            margin:4px;
            width: 100%;
            height: 100px;
            resize: vertical;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #218838;
        }

        .section {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class=" form-ctn">
    <form class="form-face">
        <div class="row g-1">
            <div class="col-md-8">
                <div class="row row-cols-1 row-cols-md-2 project-self">
                    <div class="mb-3 d-flex flex-column">
                        <label for="titre">Titre du projet</label>
                        <input id='titre' type="text">
                    </div>
                    <div class="mb-3 d-flex flex-column">
                        <label for="resume">Resumé du projet</label>
                        <input id='resume' type="text">
                    </div>
                    <div class="mb-3 d-flex flex-column">
                        <label for="domaine">Domaine du projet</label>
                       <select id="domaine" name="domaine">
                        <option value="Education">Education</option>
                        <option value="Social">Social</option>
                        <option value="Culturel">Culturel</option>
                        <option value="Technologie">Technologie</option>
                       </select>
                    </div>
                    <div class="mb-3 d-flex flex-column">
                        <label for="D_debut">date du début du projet</label>
                        <input id='D_debut' type="date">
                    </div>
                    <div class="mb-3 d-flex flex-column">
                        <label for="D_fin">date de fin du projet</label>
                        <input id='D_fin' type="date">
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                  <div id="section-template">
        <div class="section">
            <input type="text" class="section-title" placeholder="Titre de la section">
            <textarea class="section-body" placeholder="Contenu de la section"></textarea>
            <div class="toggle-container">
            <div class="toggle-option active" data-target="url">URL</div>
            <div class="toggle-option" data-target="file">Fichier</div>
            <div class="toggle-option" data-target="image">Image</div>
        </div>

        <div class="content active" id="url">
            <label for="url-input">Entrez l'URL :</label>
            <input type="text" id="url-input" placeholder="https://exemple.com">
        </div>

        <div class="content" id="file">
            <label for="file-input">Choisissez un fichier :</label>
            <input type="file" id="file-input">
        </div>

        <div class="content" id="image">
            <label for="image-input">Choisissez une image :</label>
            <input type="file" id="image-input" accept="image/*">
        </div>
        </div>
    </div>
            
            </div>

        </div>
    </form>

    </div>
    <script>
        const toggleOptions = document.querySelectorAll('.toggle-option');
        const contents = document.querySelectorAll('.content');

        toggleOptions.forEach(option => {
            option.addEventListener('click', () => {
                const target = option.getAttribute('data-target');

                toggleOptions.forEach(opt => opt.classList.remove('active'));
                contents.forEach(content => content.classList.remove('active'));

                option.classList.add('active');
                document.getElementById(target).classList.add('active');
            });
        });
    </script>
</body>
</html>
