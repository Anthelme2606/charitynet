<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une Cause ou un Projet</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            padding: 20px;
            gap: 20px;
        }

        .form-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            color: blueviolet;
        }

        .finish-btn {
            background-color: #fff;
            color: orange;
            border: 2px solid orange;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .finish-btn:hover {
            background-color: orange;
            color: white;
        }

        form {
            flex: 3;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        h2 {
            color: blueviolet;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            outline: none;
        }

        textarea {
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: blueviolet;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
        }

        .btn-add, .btn-submit {
            padding: 10px 20px;
            background-color: #fff;
            border: 2px solid orange;
            color: orange;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .btn-add:hover, .btn-submit:hover {
            background-color: orange;
            color: white;
        }

        .sidebar {
            flex: 1;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
        }

        .offer-code {
            margin-bottom: 15px;
        }

        .wallet-pass {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }

        .wallet-pass label {
            margin-left: 10px;
        }

        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1>Créer une Cause ou un Projet</h1>
            <button class="finish-btn">Finir plus tard</button>
        </div>

        <form id="causeForm">
            <div class="form-section">
                <h2>Informations de la campagne</h2>
                <div class="input-group">
                    <label for="titre">Titre de la cause/projet :</label>
                    <input type="text" id="titre" name="titre" placeholder="Entrez le titre ici" required>
                </div>
                <div class="input-group">
                    <label for="domaine">Domaine :</label>
                    <input type="text" id="domaine" name="domaine" placeholder="Ex: Éducation, Santé, etc." required>
                </div>
            </div>

            <div class="form-section">
                <h2>Audience</h2>
                <div class="input-group">
                    <label for="description">Résumé :</label>
                    <textarea id="description" name="description" placeholder="Entrez une brève description ici" rows="4" required></textarea>
                </div>
                <div class="input-group">
                    <label for="date_debut">Date de début :</label>
                    <input type="date" id="date_debut" name="date_debut" required>
                </div>
                <div class="input-group">
                    <label for="date_fin">Date de fin :</label>
                    <input type="date" id="date_fin" name="date_fin" required>
                </div>
            </div>

            <div class="form-section">
                <h2>Image du projet</h2>
                <div class="input-group">
                    <label for="image">Télécharger une image :</label>
                    <input type="file" id="image" name="image" accept="image/*" required>
                </div>
            </div>

            <div id="additional-sections">
                <!-- Sections dynamiques ajoutées ici -->
            </div>

            <div class="action-buttons">
                <button type="button" id="addSectionBtn" class="btn-add">Ajouter une section</button>
                <button type="submit" class="btn-submit">Soumettre</button>
            </div>
        </form>

        <div class="sidebar">
            <h2>Code de l'offre</h2>
            <div class="offer-code">
                <label for="prefix">Préfixe :</label>
                <input type="text" id="prefix" name="prefix">
            </div>
            <div class="offer-code">
                <label for="suffix">Suffixe :</label>
                <input type="text" id="suffix" name="suffix">
            </div>
            <div class="wallet-pass">
                <input type="checkbox" id="wallet_pass" name="wallet_pass">
                <label for="wallet_pass">Pass de portefeuille</label>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('addSectionBtn').addEventListener('click', function () {
            const additionalSections = document.getElementById('additional-sections');

            // Création d'une nouvelle section
            const sectionDiv = document.createElement('div');
            sectionDiv.classList.add('form-section');

            // Titre de la section
            const titleInput = document.createElement('input');
            titleInput.type = 'text';
            titleInput.placeholder = 'Titre de la section';
            titleInput.required = true;

            // Body (texte)
            const bodyTextarea = document.createElement('textarea');
            bodyTextarea.placeholder = 'Contenu de la section';
            bodyTextarea.rows = 3;
            bodyTextarea.required = true;

            // Fichier/URL
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*,application/pdf';

            // Ajout des éléments au DOM
            sectionDiv.appendChild(titleInput);
            sectionDiv.appendChild(bodyTextarea);
            sectionDiv.appendChild(fileInput);
            additionalSections.appendChild(sectionDiv);
        });

        // Form Submission
        document.getElementById('causeForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Formulaire soumis avec succès!');
            // Ajoutez ici la logique pour soumettre le formulaire
        });
    </script>
</body>
</html>
