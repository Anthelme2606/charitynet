<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <title>Dashboard</title>
    <style>
      :root {
        --body: #f7fafc;
        --violet: #541670;
        --orange: #f8a708;
        --primary-color: blueviolet;
        --white: #fff;
        --sidebar: #f7fafc;
        --green: #008000;
        --gray: #e0e0e0;
        --blue-pale: #e3ebeb;
        --link-bg: #f9fafc;
      }
      body {
        font-family: 'serif';
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .app{
        color:var(--violet);
        font-size:16px;
      }
      .app-charity{
        color:var(--orange) !important;
       
      }
      .sidebar {
        z-index: 9999;
        width: 250px;
        background-color: var(--sidebar);
        position: fixed;
        top: 0;
        left: -250px;
        height: 100vh;
        overflow-y: auto;
        color: var(--violet);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }
      .sidebar.active {
        left: 0;
      }
      ul li {
        list-style: none;
      }
      .link-item a {
        color: var(--violet);
        text-decoration: none;
      }
      .link-item {
        transition: background-color 0.4s ease-in-out;
      }
      .link-item:hover {
        background-color: var(--gray);
        border-radius: 20px;
        cursor: pointer;
      }
      .menu-btn {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 10000;
        background-color: var(--violet);
        color: var(--white);
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
      }
      .menu-btn:focus {
        outline: none;
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 9998;
      }
      .overlay.active {
        display: block;
      }
      @media (min-width: 992px) {
        /* .menu-btn {
          display: none;
        } */
        .sidebar {
          left: 0;
        }
        .overlay {
          display: none;
        }
      }
    </style>
  </head>
  <body>

    <aside class="sidebar vh-100">
      <div class="m-0 p-0 text-center mt-2">
        <span class="text-center app">
          <span class="app-charity">Charity</span>Net</span>
      </div>
      <div class="d-flex justify-content-between mb-2 d-lg-none">
      
        <h2 class="text-xl font-bold text-black">
          Menu
        </h2>
        <button class="menu-btn" onclick="toggleSidebar()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      
      <nav>
        <ul class="py-1">
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Tableau de bord</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Mes projets</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Faire un don</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Historique des dons</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Causes populaires</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Rapports d'impact</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Paramètre du compte</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Centre d'aide</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Programmes de bienfaisance</span>
            </a>
          </li>
          <li class="link-item">
            <a href="#" class="nav-item d-flex rounded-lg align-items-center">
              <span class="p-3">Événements caritatifs</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <script>
      function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
      }
    </script>
  </body>
</html>
